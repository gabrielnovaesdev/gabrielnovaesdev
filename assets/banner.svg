<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Gabriel Novaes, desenvolvedor front-end</title>
  <desc id="d">Interfaces com React e TypeScript, experiências 3D com Three.js, animações com GSAP e IA aplicada ao desenvolvimento.</desc>
  <defs>
    <clipPath id="nameClip"><rect x="40" y="96" width="700" height="96"/></clipPath>
    <clipPath id="roleClip"><rect x="40" y="200" width="700" height="44"/></clipPath>
    <path id="o1" d="M 820,180 a 150,52 0 1,0 300,0 a 150,52 0 1,0 -300,0"/>
    <path id="o2" d="M 880,180 a 90,30 0 1,0 180,0 a 90,30 0 1,0 -180,0"/>
    <path id="o3" d="M 770,180 a 200,72 0 1,0 400,0 a 200,72 0 1,0 -400,0"/>
  </defs>
  <style>
    :root { --bg:#ffffff; --line:#e4e4e7; --ring:#d4d4d8; --ink:#09090b; --muted:#71717a; --soft:#a1a1aa; --chip:#f4f4f5; --accent:#6d5efc; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --line:#21262d; --ring:#30363d; --ink:#f0f6fc; --muted:#9198a1; --soft:#6e7681; --chip:#161b22; --accent:#8b7dff; }
    }
    text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: var(--bg); stroke: var(--line); }
    .ink { fill: var(--ink); } .muted { fill: var(--muted); } .soft { fill: var(--soft); }
    .accent { fill: var(--accent); } .chip { fill: var(--chip); stroke: var(--line); }
    .ring { fill: none; stroke: var(--ring); stroke-width: 1.2; }

    /* Entrada: rótulo, nome subindo de dentro da máscara e pílulas */
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .name { transform: translateY(100px); animation: up 1.1s cubic-bezier(.22,1,.36,1) .15s forwards; }
    @keyframes up { to { transform: none } }
    .c1 { animation-delay: .9s } .c2 { animation-delay: 1s } .c3 { animation-delay: 1.1s } .c4 { animation-delay: 1.2s } .c5 { animation-delay: 1.3s } .c6 { animation-delay: 1.4s }

    /* Especialidades alternando */
    .role { transform: translateY(44px); animation: role 16s cubic-bezier(.65,0,.35,1) infinite; }
    .r1 { animation-delay: .6s } .r2 { animation-delay: 4.6s } .r3 { animation-delay: 8.6s } .r4 { animation-delay: 12.6s }
    @keyframes role {
      0% { transform: translateY(44px) }
      4.5%, 22.5% { transform: none }
      27%, 100% { transform: translateY(-44px) }
    }

    /* Órbitas se desenhando */
    .draw { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.2s cubic-bezier(.65,0,.35,1) forwards; }
    .d2 { animation-delay: .25s } .d3 { animation-delay: .5s }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .live { transform-box: fill-box; transform-origin: center; animation: live 2.4s ease-out infinite; }
    @keyframes live { from { transform: scale(1); opacity: .5 } to { transform: scale(2.6); opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .name, .draw { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
      .role { animation: none; } .r1 { transform: none; } .live { animation: none; }
    }
  </style>

  <rect class="bg" x=".5" y=".5" width="1279" height="359" rx="20"/>

  <!-- Rótulo -->
  <g class="fade">
    <circle class="accent live" cx="72" cy="78" r="4.5"/>
    <circle class="accent" cx="72" cy="78" r="4.5"/>
    <text class="muted" x="88" y="84" font-size="17" font-weight="500">Desenvolvedor front-end</text>
  </g>

  <!-- Nome -->
  <g clip-path="url(#nameClip)">
    <text class="ink name" x="62" y="168" font-size="72" font-weight="650" letter-spacing="-2.8">Gabriel Novaes</text>
  </g>

  <!-- Especialidades -->
  <g clip-path="url(#roleClip)" font-size="24">
    <text class="muted role r1" x="64" y="230">Interfaces com React e TypeScript</text>
    <text class="muted role r2" x="64" y="230">Experiências 3D com Three.js e WebGL</text>
    <text class="muted role r3" x="64" y="230">Animações e rolagem com GSAP e Lenis</text>
    <text class="muted role r4" x="64" y="230">IA generativa no fluxo de desenvolvimento</text>
  </g>

  <!-- Stack -->
  <g font-size="14" font-weight="500">
    <g class="fade c1"><rect class="chip" x="64" y="272" width="74" height="30" rx="15"/><text class="ink" x="101" y="292" text-anchor="middle">React</text></g>
    <g class="fade c2"><rect class="chip" x="146" y="272" width="104" height="30" rx="15"/><text class="ink" x="198" y="292" text-anchor="middle">TypeScript</text></g>
    <g class="fade c3"><rect class="chip" x="258" y="272" width="92" height="30" rx="15"/><text class="ink" x="304" y="292" text-anchor="middle">Three.js</text></g>
    <g class="fade c4"><rect class="chip" x="358" y="272" width="70" height="30" rx="15"/><text class="ink" x="393" y="292" text-anchor="middle">GSAP</text></g>
    <g class="fade c5"><rect class="chip" x="436" y="272" width="96" height="30" rx="15"/><text class="ink" x="484" y="292" text-anchor="middle">Supabase</text></g>
    <g class="fade c6"><rect class="chip" x="540" y="272" width="46" height="30" rx="15"/><text class="ink" x="563" y="292" text-anchor="middle">IA</text></g>
  </g>

  <!-- Sistema orbital -->
  <g transform="rotate(-14 970 180)">
    <use href="#o3" class="ring draw d3"/>
    <use href="#o1" class="ring draw d2"/>
    <use href="#o2" class="ring draw"/>

    <circle cx="970" cy="180" r="14" class="ink"/>
    <circle cx="970" cy="180" r="30" class="ring"/>

    <circle r="6" class="accent">
      <animateMotion dur="9s" repeatCount="indefinite" rotate="0"><mpath href="#o2"/></animateMotion>
    </circle>
    <circle r="5" class="muted">
      <animateMotion dur="15s" begin="-4s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion>
    </circle>
    <circle r="7" class="soft">
      <animateMotion dur="24s" begin="-10s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion>
    </circle>
    <circle r="3.5" class="accent">
      <animateMotion dur="24s" begin="-22s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion>
    </circle>
  </g>
</svg>
