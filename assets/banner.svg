<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Gabriel Novaes</title>
  <desc id="d">Desenvolvedor web: front-end com React e TypeScript e IA aplicada ao desenvolvimento.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    text.mono { font-family: "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; transform-box: fill-box; animation: rise 1s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s } .d4 { animation-delay: .7s }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }

    .role { opacity: 0; transform-box: fill-box; animation: cycle 12s cubic-bezier(.22,1,.36,1) infinite; }
    .r2 { animation-delay: 4s } .r3 { animation-delay: 8s }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(18px) }
      5%, 28% { opacity: 1; transform: none }
      33%, 100% { opacity: 0; transform: translateY(-18px) }
    }

    .grid line { stroke: #16161a; }
    .pulse { transform-origin: 1128px 92px; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .6 } to { transform: scale(3); opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .role.r1 { opacity: 1; animation: none; }
      .role, .pulse { animation: none; }
    }
  </style>

  <rect width="1280" height="360" rx="24" fill="#09090b"/>
  <g class="grid">
    <line x1="0" y1="90" x2="1280" y2="90"/><line x1="0" y1="180" x2="1280" y2="180"/><line x1="0" y1="270" x2="1280" y2="270"/>
    <line x1="320" y1="0" x2="320" y2="360"/><line x1="640" y1="0" x2="640" y2="360"/><line x1="960" y1="0" x2="960" y2="360"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="359" rx="23.5" fill="none" stroke="#27272a"/>

  <text class="rise d1 mono" x="80" y="98" font-size="20" fill="#71717a">~/gabrielnovaesdev</text>
  <text class="rise d2" x="76" y="186" font-size="84" font-weight="700" letter-spacing="-3" fill="#fafafa">Gabriel Novaes</text>

  <g class="mono" font-size="28">
    <text class="rise d3 mono" x="80" y="252" fill="#7c5cff">&gt;</text>
    <text class="role r1 mono" x="110" y="252" fill="#e4e4e7">Desenvolvedor web</text>
    <text class="role r2 mono" x="110" y="252" fill="#e4e4e7">Front-end com React e TypeScript</text>
    <text class="role r3 mono" x="110" y="252" fill="#e4e4e7">IA aplicada ao desenvolvimento</text>
  </g>

  <!-- Status no canto -->
  <g class="rise d4">
    <circle class="pulse" cx="1128" cy="92" r="6" fill="#22c55e"/>
    <circle cx="1128" cy="92" r="6" fill="#22c55e"/>
    <text x="1144" y="99" font-size="20" fill="#a1a1aa">estagiando</text>
  </g>
  <text class="rise d4 mono" x="1200" y="300" text-anchor="end" font-size="18" fill="#52525b">React · TypeScript · Supabase · IA</text>
</svg>
