<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">Gabriel Novaes, desenvolvedor front-end</title>
  <desc id="d">Interfaces web com React, TypeScript e IA. Projetos: NovaeStore, Nébula e BarberGo.</desc>
  <style>
    :root {
      --bg: #ffffff; --line: #e4e4e7; --ink: #09090b; --muted: #71717a; --soft: #a1a1aa; --chip: #f4f4f5; --accent: #6d5efc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --line: #262a31; --ink: #f4f4f5; --muted: #9ca3af; --soft: #6b7280; --chip: #161b22; --accent: #8b7dff; }
    }
    text { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: var(--bg); stroke: var(--line); }
    .ink { fill: var(--ink); } .muted { fill: var(--muted); } .soft { fill: var(--soft); } .accent { fill: var(--accent); }
    .chip { fill: var(--chip); stroke: var(--line); }
    .rule { stroke: var(--line); }

    .in { opacity: 0; transform-box: fill-box; animation: in .9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .a1 { animation-delay: .05s } .a2 { animation-delay: .15s } .a3 { animation-delay: .25s } .a4 { animation-delay: .35s }
    .p1 { animation-delay: .45s } .p2 { animation-delay: .55s } .p3 { animation-delay: .65s }
    @media (prefers-reduced-motion: reduce) { .in { opacity: 1; animation: none; } }
  </style>

  <rect class="bg" x=".5" y=".5" width="1279" height="339" rx="20"/>

  <!-- Identidade -->
  <g class="in a1">
    <circle class="accent" cx="70" cy="80" r="5"/>
    <text class="muted" x="86" y="86" font-size="17" font-weight="500">Desenvolvedor front-end</text>
  </g>
  <text class="ink in a2" x="62" y="156" font-size="68" font-weight="650" letter-spacing="-2.6">Gabriel Novaes</text>
  <text class="muted in a3" x="64" y="200" font-size="21">Interfaces web com React e TypeScript, do layout ao deploy,</text>
  <text class="muted in a3" x="64" y="230" font-size="21">com IA generativa no meu fluxo de trabalho.</text>

  <!-- Stack em pílulas -->
  <g class="in a4" font-size="14" font-weight="500">
    <rect class="chip" x="64" y="262" width="74" height="30" rx="15"/><text class="ink" x="101" y="282" text-anchor="middle">React</text>
    <rect class="chip" x="146" y="262" width="104" height="30" rx="15"/><text class="ink" x="198" y="282" text-anchor="middle">TypeScript</text>
    <rect class="chip" x="258" y="262" width="96" height="30" rx="15"/><text class="ink" x="306" y="282" text-anchor="middle">Supabase</text>
    <rect class="chip" x="362" y="262" width="92" height="30" rx="15"/><text class="ink" x="408" y="282" text-anchor="middle">Three.js</text>
    <rect class="chip" x="462" y="262" width="128" height="30" rx="15"/><text class="ink" x="526" y="282" text-anchor="middle">React Native</text>
  </g>

  <!-- Projetos mais completos -->
  <line class="rule" x1="760" y1="40" x2="760" y2="300"/>
  <text class="soft in a2" x="800" y="72" font-size="13" font-weight="600" letter-spacing="1.4">PROJETOS</text>

  <g class="in p1">
    <text class="ink" x="800" y="114" font-size="19" font-weight="600">NovaeStore</text>
    <text class="muted" x="800" y="137" font-size="15">E-commerce com checkout via Pix e Supabase</text>
  </g>
  <line class="rule in p1" x1="800" y1="156" x2="1216" y2="156"/>
  <g class="in p2">
    <text class="ink" x="800" y="183" font-size="19" font-weight="600">Nébula</text>
    <text class="muted" x="800" y="206" font-size="15">Site com cena 3D em WebGL e motion design</text>
  </g>
  <line class="rule in p2" x1="800" y1="225" x2="1216" y2="225"/>
  <g class="in p3">
    <text class="ink" x="800" y="252" font-size="19" font-weight="600">BarberGo</text>
    <text class="muted" x="800" y="275" font-size="15">App de barbeiro em domicílio em React Native</text>
  </g>
</svg>
